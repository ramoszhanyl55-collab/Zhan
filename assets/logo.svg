  <!-- Brand Name Typography -->
  <text x="68" y="28" font-family="'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#0F172A" letter-spacing="0.5">Dolce Brezza</text>
  <text x="69" y="44" font-family="'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" fill="#E1903E" letter-spacing="2.5">CAFÉ &amp; ROASTERY</text>
