<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260" fill="none" role="img" aria-label="Bourbon Barrel Cold Brew in rock glass with spherical crystal ice">
  <defs>
    <radialGradient id="bourbonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E1903E" stop-opacity="0.3"/>
      <stop offset="65%" stop-color="#EFCE7B" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#F8FAFC" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="whiskeyCold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B45309"/>
      <stop offset="40%" stop-color="#78350F"/>
      <stop offset="100%" stop-color="#2D1104"/>
    </linearGradient>
    <radialGradient id="iceSphere" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#E0F2FE" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#BAE6FD" stop-opacity="0.2"/>
    </radialGradient>
  </defs>
  <rect width="400" height="260" rx="14" fill="#F8FAFC"/>
  <circle cx="200" cy="130" r="105" fill="url(#bourbonGlow)"/>
  <!-- Coaster -->
  <ellipse cx="200" cy="205" rx="85" ry="18" fill="#E2E8F0"/>
  <!-- Lowball Rock Glass -->
  <!-- Heavy Base -->
  <rect x="150" y="80" width="100" height="115" rx="8" fill="url(#whiskeyCold)"/>
  <rect x="150" y="180" width="100" height="15" rx="4" fill="#E2E8F0" opacity="0.6"/>
  <!-- Glass Reflections -->
  <rect x="150" y="80" width="100" height="115" rx="8" stroke="#CBD5E1" stroke-width="2" fill="none"/>
  <line x1="156" y1="88" x2="156" y2="185" stroke="#FFFFFF" stroke-width="2.5" opacity="0.4" stroke-linecap="round"/>
  <!-- Giant Clear Ice Sphere -->
  <circle cx="200" cy="125" r="32" fill="url(#iceSphere)" stroke="#FFFFFF" stroke-width="1.5" opacity="0.85"/>
  <ellipse cx="192" cy="115" rx="12" ry="6" fill="#FFFFFF" opacity="0.5"/>
  <!-- Vanilla Orchid / Garnish petal -->
  <path d="M225 85 C235 75, 248 80, 240 92 C232 98, 222 92, 225 85 Z" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.2"/>
</svg>
