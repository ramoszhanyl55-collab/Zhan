<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260" fill="none" role="img" aria-label="Dolce Brezza Sea Salt Macchiato with caramel foam">
  <defs>
    <radialGradient id="maccGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E1903E" stop-opacity="0.32"/>
      <stop offset="70%" stop-color="#EFCE7B" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#F8FAFC" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="milkLayer" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF7"/>
      <stop offset="100%" stop-color="#FEF3C7"/>
    </linearGradient>
    <linearGradient id="espressoDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350F"/>
      <stop offset="100%" stop-color="#3A1702"/>
    </linearGradient>
  </defs>
  <rect width="400" height="260" rx="14" fill="#F8FAFC"/>
  <circle cx="200" cy="130" r="105" fill="url(#maccGlow)"/>
  <!-- Coaster -->
  <ellipse cx="200" cy="215" rx="80" ry="18" fill="#E2E8F0"/>
  <!-- Layered Glass Tumbler -->
  <!-- Milk Bottom Layer -->
  <path d="M165 140 L172 205 C173 211, 180 215, 200 215 C220 215, 227 211, 228 205 L235 140 Z" fill="url(#milkLayer)"/>
  <!-- Espresso Middle Layer -->
  <path d="M160 95 L165 140 L235 140 L240 95 Z" fill="url(#espressoDark)"/>
  <!-- Cold Foam Top Layer -->
  <path d="M156 60 L160 95 L240 95 L244 60 Z" fill="#FFFBEB"/>
  <ellipse cx="200" cy="58" rx="44" ry="12" fill="#FFFFFF"/>
  <!-- Glass Outline & Highlights -->
  <path d="M155 58 L172 205 C173 211, 180 215, 200 215 C220 215, 227 211, 228 205 L245 58 Z" stroke="#CBD5E1" stroke-width="2" fill="none"/>
  <!-- Sea Salt Caramel Drizzle -->
  <path d="M170 56 Q180 48 190 56 T210 56 T230 56" stroke="#D97706" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M176 62 Q188 54 200 62 T224 62" stroke="#B45309" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Crystal Salt Flakes -->
  <rect x="185" y="52" width="2.5" height="2.5" fill="#FFFFFF" transform="rotate(45 186 53)"/>
  <rect x="215" y="54" width="3" height="3" fill="#FFFFFF" transform="rotate(30 216 55)"/>
</svg>
