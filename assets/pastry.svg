<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" fill="none" role="img" aria-label="Freshly baked golden artisanal butter croissant">
  <defs>
    <radialGradient id="pastryBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EFCE7B" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#F8FAFC" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="crustGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="30%" stop-color="#E1903E"/>
      <stop offset="70%" stop-color="#EFCE7B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="#F8FAFC"/>
  <circle cx="200" cy="150" r="120" fill="url(#pastryBg)"/>
  <!-- Ceramic plate -->
  <ellipse cx="200" cy="210" rx="130" ry="32" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <ellipse cx="200" cy="208" rx="105" ry="22" fill="#F1F5F9"/>
  <!-- Croissant Body -->
  <!-- Center hump -->
  <ellipse cx="200" cy="170" rx="60" ry="42" fill="url(#crustGrad)"/>
  <!-- Left wing -->
  <path d="M160 175 C120 180, 100 200, 125 210 C150 215, 175 190, 185 180 Z" fill="url(#crustGrad)"/>
  <!-- Right wing -->
  <path d="M240 175 C280 180, 300 200, 275 210 C250 215, 225 190, 215 180 Z" fill="url(#crustGrad)"/>
  <!-- Pastry layers & scoring folds -->
  <path d="M165 155 C185 145, 215 145, 235 155" stroke="#92400E" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M150 170 C180 160, 220 160, 250 170" stroke="#92400E" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M140 185 C175 178, 225 178, 260 185" stroke="#78350F" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Flaky Crumbs -->
  <circle cx="115" cy="215" r="2.5" fill="#D97706"/>
  <circle cx="285" cy="216" r="3" fill="#D97706"/>
  <circle cx="205" cy="222" r="2" fill="#B45309"/>
</svg>
